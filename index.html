  // rest of the site does for external links.
  var EXT = {target:"_blank", rel:"noopener"};
  function ext(attrs){ attrs.target = EXT.target; attrs.rel = EXT.rel; return attrs; }
  if (L.github) links.appendChild(el("a", ext({href: L.github}), [icon("github"), document.createTextNode("GitHub")]));
  if (L.linkedin) links.appendChild(el("a", ext({href: L.linkedin}), [icon("linkedin"), document.createTextNode("LinkedIn")]));
  links.appendChild(themeBtn);
  paintTheme();

  var chips = document.getElementById("chips");
  TYPES.forEach(function(t){
    var b = el("button", {type:"button", class:"tab", "data-type": t[0], "aria-pressed": String(state.type === t[0])},
               [ICON[t[0]] ? icon(t[0]) : null, el("span", {class:"tab-text", "data-text": t[1]}, [el("span", {text: t[1]})])]);
    b.addEventListener("click", function(){ state.type = t[0]; sync(); render(); });
    chips.appendChild(b);
  });
  var q = document.getElementById("q");
  q.value = state.q;
  q.addEventListener("input", function(){ state.q = q.value; sync(); render(); });
  var from = document.getElementById("from"), to = document.getElementById("to");
  from.value = state.from; to.value = state.to;
  from.addEventListener("change", function(){ state.from = from.value; sync(); render(); });
  to.addEventListener("change", function(){ state.to = to.value; sync(); render(); });

  function sync(){
    var p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.type !== "all") p.set("type", state.type);
    if (state.from) p.set("from", state.from);
    if (state.to) p.set("to", state.to);
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash);
    chips.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-type") === state.type)); });
  }
  function matches(e){
    // "All" shows the latest commit per repository; the Commits tab shows
    // the monthly history instead.
    if (state.type === "all" && e.type === "commits") return false;
    if (state.type === "commits" && e.type === "commit") return false;
    if (state.type !== "all" && e.type !== state.type && e.type !== "commit") return false;
    if (state.type !== "all" && state.type !== "commits" && e.type === "commit") return false;
    if (state.from && e.day < state.from) return false;
    if (state.to && e.day > state.to) return false;
    if (!state.q) return true;
    var hay = (e.repo + " " + e.title + " " + (e.number || "") + " " + LABEL[e.type] + " " + e.state).toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(function(w){ return !w || hay.indexOf(w) >= 0; });
  }
  // Which GitHub state icon marks an entry on the timeline, and its colour class.
  function marker(e){
    if (e.type === "issue") return e.state === "open" ? ["issue-open","open"] : (e.reason === "not_planned" ? ["issue-skip","muted"] : ["issue-closed","done"]);
    if (e.type === "pr") return {open:["pr-open","open"], draft:["pr-draft","muted"], merged:["pr-merged","done"], closed:["pr-closed","closed"]}[e.state] || ["pr-open","muted"];
    if (e.type === "review") return {approved:["review-approved","open"], changes_requested:["review-changes","closed"]}[e.state] || ["review-comment","muted"];
    if (e.type === "advisory") return ["shield","done"];
    return ["commit","muted"];
  }
  // Metadata verb as GitHub writes it: "#1275 · owner/repo · opened Sep 10".
  function verb(e){
    if (e.type === "commits") return "pushed";
    if (e.type === "commit") return "committed";
    if (e.type === "advisory") return "published";
    if (e.type === "review") return {approved:"approved", changes_requested:"requested changes"}[e.state] || "reviewed";
    return {open:"opened", draft:"opened", merged:"merged", closed:"closed"}[e.state] || e.state;
  }
  function entryNode(e){
    // Row as on GitHub's issue and pull request lists: state icon, title,
    // then a muted metadata line. State is the icon plus the verb; only an
    // advisory keeps a label, its severity, as on the Security tab.
    var m = marker(e);
    var mark = el("span", {class:"marker marker--" + m[1], title: LABEL[e.type] + " " + e.state.replace("_"," ")}, [icon(m[0])]);
    var parts = [];
    if (e.type !== "commits") parts.push(el("span", {class: e.type === "commit" ? "num sha" : "num", text: (e.type === "advisory" || e.type === "commit") ? e.number : "#" + e.number}));
    parts.push(el("a", ext({class:"repo", href: e.type === "commits" ? e.url : e.repo_url, text: e.repo})));
    parts.push(el("span", {class:"when"}, [document.createTextNode(verb(e) + " "), el("time", {class:"date", datetime: e.at || e.day, text: dayName(e.day)})]));
    if (e.state === "draft") parts.push(el("span", {text: "Draft"}));
    var meta = el("div", {class:"meta"});
    parts.forEach(function(x, k){ if (k) meta.appendChild(el("span", {class:"sep", "aria-hidden":"true", text: "·"})); meta.appendChild(x); });
    var title = e.type === "review" ? "Review of " + e.title : e.title;
    return el("li", {class: "entry " + e.type + " " + e.state, id: e.id}, [
      mark,
      el("div", {class:"main"}, [el("a", ext({class:"item", href: e.url, text: title})), meta]),
      e.type === "advisory" ? el("span", {class:"status status--outline " + e.state, text: e.state}) : el("span"),
      el("a", {class:"anchor", href: "#" + e.id, title: "Direct link to this entry", "aria-label": "Direct link"}, [icon("link")])
    ]);
  }
  function render(){
    var tl = document.getElementById("timeline");
    tl.textContent = "";
    var shown = entries.filter(matches);
    if (!shown.length) { tl.appendChild(el("li", {class:"empty", text:"Nothing matches. Clear the search or pick another type."})); return; }
    var byMonth = {}, order = [];
    shown.forEach(function(e){ var m = e.day.slice(0,7); if (!byMonth[m]) { byMonth[m] = []; order.push(m); } byMonth[m].push(e); });
    order.forEach(function(m){
      tl.appendChild(el("li", {class:"month"}, [
        el("h2", {class:"month-title", text: monthName(m)}),
        el("ol", {class:"entries"}, byMonth[m].map(entryNode))
      ]));
    });
  }

  render();
  if (location.hash) {
    var id = decodeURIComponent(location.hash.slice(1));
    if (!document.getElementById(id) && entries.some(function(e){ return e.id === id; })) {
      state.q = ""; state.type = "all"; state.from = ""; state.to = ""; q.value = ""; from.value = ""; to.value = ""; sync(); render();
    }
    var t = document.getElementById(id); if (t) t.scrollIntoView({block:"center"});
  }
})();
</script>
</body>
</html>
