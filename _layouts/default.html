<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="site">
        <a href="{{ '/' | relative_url }}">Contributions</a>
        <a href="https://github.com/erts-sched" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="container">
      {% if page.url != "/" %}
      <nav class="crumb" aria-label="breadcrumb"><a href="{{ '/' | relative_url }}">Contributions</a></nav>
      {% endif %}
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>{{ site.description }}</span>
      <a href="https://github.com/erts-sched" target="_blank" rel="noopener">github.com/erts-sched</a>
    </div>
  </footer>

  <script>
    for (const a of document.querySelectorAll('main a[href^="http"]')) {
      if (a.hostname !== location.hostname) { a.target = "_blank"; a.rel = "noopener"; }
    }
    for (const t of document.querySelectorAll("main table")) {
      const w = document.createElement("div"); w.className = "table-wrap"; w.tabIndex = 0;
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    }
  </script>
</body>
</html>
